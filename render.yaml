# Render Blueprint — GRNT
# 개인·창업 통합 지원금 판정기 (웹 UI + JSON API + MCP)
#
# 사용법
#   1) 저장소를 Render 에 연결하고 Blueprint(render.yaml) 선택
#   2) 배포 후 https://<서비스>.onrender.com/healthz 확인
#      — 이미지에 data/gov24/catalog.json.gz(약 3.8MB)가 들어 있어 동기화 없이 12,429건으로 뜽니다.
#   3) 더 최신 데이터가 필요하면 Render Shell 에서
#      PYTHONPATH=/app/src python -m subsidy_kr.sync_gov24 --sources all --key <인증키> 를 한 번 실행합니다.
#      (Shell 에서 만든 catalog.json 은 재배포 시 사라집니다. 계속 쓰려면 압축본을 저장소에 다시 커밋해 배포)
#
# 주의
#   - 서버에는 API 키가 필요 없습니다(공개 판정 전용). 키는 동기화 스크립트에서만 씁니다.
#   - free 플랜은 영구 디스크가 없어 카운터·스냅샷이 재배포 시 초기화됩니다.
#     익명 카운터를 살리려면 디스크를 붙이고 `GRNT_STATS_PATH` 를 그 안의 파일로 지정하세요.
#   - 카탈로그(마감 공고)는 `.github/workflows/refresh-catalog.yml` 이 매일 갱신해 커밋합니다.
#   - free 플랜은 미접속 시 슬립되므로 첫 요청이 30~60초 걸릴 수 있습니다.
services:
  - type: web
    name: grnt-kr
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://grnt-kr.onrender.com
      - key: SUBSIDY_KR_DATA
        value: /app/data/gov24
      - key: SUBSIDY_KR_DB
        value: /app/data/app.sqlite
