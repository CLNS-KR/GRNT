# Render Blueprint — GRNT
# 개인·창업 통합 지원금 판정기 (웹 UI + JSON API + MCP)
#
# 사용법
#   1) 저장소를 Render 에 연결하고 Blueprint(render.yaml) 선택
#   2) 배포 후 https://<서비스>.onrender.com/ 확인
#   3) 실데이터로 바꾸려면 Render Shell 에서
#      PYTHONPATH=/app/src python -m subsidy_kr.sync_gov24 --sources all --key <인증키> 를 한 번 실행합니다.
#      (동기화 산출물은 저장소·이미지에 넣지 않습니다. 무료 플랜은 재배포 시 초기화됩니다.)
#
# 주의
#   - 서버에는 API 키가 필요 없습니다(공개 판정 전용). 키는 동기화 스크립트에서만 씁니다.
#   - free 플랜은 영구 디스크가 없어 카운터·스냅샷이 재배포 시 초기화됩니다.
#   - free 플랜은 미접속 시 슬립되므로 첫 요청이 30~60초 걸릴 수 있습니다.
services:
  - type: web
    name: grnt
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://grnt.onrender.com
      - key: SUBSIDY_KR_DATA
        value: /app/data/gov24
      - key: SUBSIDY_KR_DB
        value: /app/data/app.sqlite
